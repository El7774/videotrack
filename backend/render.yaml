services:
  - type: web
    name: cinetrack-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_BEARER
        sync: false
      - key: RESEND_API_KEY
        sync: false
